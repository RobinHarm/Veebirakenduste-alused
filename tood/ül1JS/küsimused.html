<!DOCTYPE html>
<html lang="et">
<head>

<input type="checkbox" name="muusikud" id="AlanWalker" value="AlanWalker" onChange="Muusika()">

        </td>

        <td>

        </td>
        </tr>
        <tr>

        </td>

            </td>

                <input type="radio" name="stiil" id="muu" value="muu" >
