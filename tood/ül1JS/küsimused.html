<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Küsimused</title>
    <script src="../js/muusikaScript.js"></script>
    <link rel="stylesheet" href="küsimusStyle.css">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHWThkBvsDDEvtFFmqPF/LYI/Cxo=" crossorigin="anonymous"></script>
    <script> $(function(){
        // peidame vead
        $('.viga').hide();

        // puhastusnupp
        $('#puhasta').click(function(){
            $('#muusikaVorm')[0].reset();
            $('.viga').hide();
        });

        // valideerimine, kui vorm on saadetud
        $('#muusikaVorm').submit(function(event){
            let valid = true;

            // 1. Checkbox
            if($('input[name="muusik"]:checked').length === 0){
                $('#viga1').show();
                valid = false;
            } else { $('#viga1').hide(); }

            // 3. Number (0–24)
            let tunnid = $('#tund').val();
            if(tunnid === "" || isNaN(tunnid) || tunnid < 0 || tunnid > 24){
                $('#viga3').show();
                valid = false;
            } else { $('#viga3').hide(); }

            // 4. Radio
            if($('input[name="raadio"]:checked').length === 0){
                $('#viga4').show();
                valid = false;
            } else { $('#viga4').hide(); }

            // 5. Text (ainult tähed)
            let tekst = $('#radiojaamad').val().trim();
            if(tekst === "" || !/^[a-zA-Z\s]+$/.test(tekst)){
                $('#viga5').show();
                valid = false;
            } else { $('#viga5').hide(); }

            // 6. Select
            if($('#stiil').val() === ""){
                $('#viga6').show();
                valid = false;
            } else { $('#viga6').hide(); }

            // kui on vead, siis ei ole vaja vormi saada
            if(!valid){
                event.preventDefault();
            } else {
                alert("Vorm on edukalt saadetud!");
            }
        });
    });
    </script>
</head>
<body>
<form id="muusikaVorm" action="#">
    <table border="1">
        <tr>
            <td colspan="2">
                <fieldset>
                    <legend>
                        <strong>Muusikud:</strong>
                    </legend>
                    <br>
<input type="checkbox" name="muusik" id="AlanWalker" value="AlanWalker" onChange="Muusikud()">
<label for="AlanWalker">Alan Walker</label>
<br>
<input type="checkbox" name="muusik" id="EdSheeran" value="EdSheeran" onChange="Muusikud()">
<label for="EdSheeran">Ed Sheeran</label>
<br>
<input type="checkbox" name="muusik" id="NCS" value="NCS" onChange="Muusikud()">
<label for="NCS">NCS</label>
<br>
<input type="checkbox" name="muusik" id="Eminem" value="Eminem" onChange="Muusikud()">
<label for="Eminem">Eminem</label>
<br>
<input type="checkbox" name="muusik" id="ViisMiinust" value="ViisMiinust" onChange="Muusikud()">
<label for="ViisMiinust">Viis miinust</label>
                </fieldset>
            </td>
        <td>
        <div id="vastus1">

        </div>
            <span class="viga" id="viga1">Palun vali vähemalt ühe muusiku</span>
        </td>
        </tr>

        <tr>
            <td>
                <!--tekstikast -->
                <label for="Arvamus">Sisesta oma arvamus koolis muusika kuulamise kohta:</label>
            </td>
            <td>
                <input type="text" id="Arvamus" oninput="Muusikakuulamine()">
            </td>
            <td>
                <div id="vastus2">

                </div>
            </td>
        </tr>
        <tr>
            <td>
        <label for="tund">Mitu tundi päevas sa kuulad muusikat</label>
        </td>
        <td>
            <input type="number" min="0" max="24" step="1" value="" id="tund" onclick="MuusikaAeg()">
        </td>

        <td>
            <div id="vastus3"></div>
            <span class="viga" id="viga3">palun Sisesta number 0-24</span>
        </td>
        </tr>
        <tr>
            <td colspan="2">
                        <strong>Kas sa kuulad raadiot</strong>
                    <input type="radio" name="Vastus6" id="Jah" value="Jah" onChange="KasMuusika()" >
                    <label for="Jah">Jah</label>
                    <br>
                    <input type="radio" name="Vastus6" id="Ei" value="Ei" onChange="KasMuusika()">
                    <label for="Ei">Ei</label>
        <td>
            <div id="muusika3"></div>
            <span class="viga" id="viga4">Palun vali vastus</span>
        </td>
        </tr>
                    <tr>
                        <td>
                            <!--tekstikast -->
                            <label for="radiojaamad">Milliseid raadiojaamu oskad nimetada?</label>
                        </td>
                        <td>
                            <input type="text" id="radiojaamad" oninput="raadioJaam()">
                        </td>
                        <td>
        <div id="vastus5">

        </div>
        <span class="viga" id="viga5">Palun vali raadiojaam</span>
        <tr>
            <td>
                <br>
                <strong>Millist muusikat sa koige rohkem kuulad</strong>
                <br>
            </td>
            <td>
                <!-- radionupp - ainult üks valik on õige -->
                <input type="radio" name="stiil" id="Jazz" value="Jazz" onchange="muusikastiil()">
                <label for="Jazz">Jazz</label>
                <br>
                <input type="radio" name="stiil" id="HipHop" value="HipHop" onchange="muusikastiil()">
                <label for="HipHop">Hip-Hop</label>
                <br>
                <input type="radio" name="stiil" id="rap" value="rap" onchange="muusikastiil()">
                <label for="rap">rap</label>
                <br>
                <input type="radio" name="stiil" id="Rock" value="Rock" onchange="muusikastiil()">
                <label for="Rock">Rock</label>
                <br>
                <input type="radio" name="stiil" id="EDM" value="EDM" onchange="muusikastiil()">
                <label for="EDM">EDM</label>
                <br>
                <input type="radio" name="stiil" id="muu" value="muu" onchange="muusikastiil()">
                <label for="muu">muu</label>
            </td>
        <td>
            <div id="vastus6">

            </div>
            <span class="viga" id="viga6">Palun vali stiil</span>
        </td>

        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()" id="puhasta">
            </td>
            <td>
                <input type="button" value="Näita andmed" onclick="Tervitus()">
            </td>
            <td>
                <div id="vastus4"></div>

            </td>
        </tr>
    </table>
</form>
</body>
</html>
