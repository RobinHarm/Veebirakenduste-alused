<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vormid ja nupud HTML keeles</title>
  <script src="../js/ankeetScript.js"></script>
</head>
<body>
<h1>Sportlase ankeet</h1>
<form action="#">
  <table border="1">
    <tr>
      <td>
        <!--tekstikast -->
        <label for="nimi">Sisesta oma nimi:</label>
      </td>
      <td>
        <input type="text" id="nimi" oninput="nimiLugemine()">
      </td>
      <td>
        <div id="vastus"></div>
      </td>
    </tr>

    <tr>
      <td>
        <br>
        <strong>Vali sugu:</strong>
        <br>
      </td>
      <td>
        <!-- radionupp - ainult üks valik on õige -->
        <input type="radio" name="sugu" id="naine" value="naine" onclick="suguValik()">
        <label for="naine">naine</label>
        <br>
        <input type="radio" name="sugu" id="mees" value="mees" onclick="suguValik()">
        <label for="mees">mees</label>
        <br>
        <input type="radio" name="sugu" id="muu" value="muu" onclick="suguValik()">
        <label for="muu">muu</label>
      </td>
      <td>
        <div id="vastus2"></div>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <fieldset>
          <legend>
            <strong>Spordialad:</strong>
          </legend>
          <br>
          <input type="checkbox" name="spordiala" id="jooksmine" value="jooksmine" onchange="sportimine()">
          <label for="jooksmine">jooksmine</label>
          <br>
          <input type="checkbox" name="spordiala" id="ujumine" value="ujumine" onchange="sportimine()">
          <label for="ujumine">ujumine</label>
          <br>
          <input type="checkbox" name="spordiala" id="uisutamine" value="uisutamine" onchange="sportimine()">
          <label for="uisutamine">uisutamine</label>
          <br>
          <input type="checkbox" name="spordiala" id="suusatamine" value="suusatamine" onchange="sportimine()">
          <label for="suusatamine">suusatamine</label>
          <br>
          <input type="checkbox" name="spordiala" id="jalgpall" value="jalgpall" onchange="sportimine()">
          <label for="jalgpall">jalgpall</label>
        </fieldset>
      </td>
      <td>
        <div id="vastus3"></div>
      </td>
    </tr>

    <tr>
      <td>
        <!-- arvud number -->
        <label for="tund">Mitu tundi nädalas sina teed trenni</label>
      </td>
      <td>
        <input type="number" min="0" max="24" step="1" value="0" id="tund">
      </td>
    </tr>

    <tr>
      <td>
        <!-- rippmenüü -dropdownlist -->
        <label for="klubi">Mis klubi sa külastad?</label>
      </td>
      <td>

        <select name="klubi" id="klubi">
          <option value="vali">Vali...</option>
          <option value="gym">GYM</option>
          <option value="myfitness">myfitness</option>
          <option value="gym25">GYM24</option>
          <option value="kalevspa">KalevSPA</option>
        </select>
      </td>
    </tr>
    <tr>
      <td>
        <label for="varv">Mis värvi tossud sul on?</label>
      </td>
      <td>
        <input type="color" id="varv">
      </td>
    </tr>
    <tr>
      <td>
        <label for="kuupäev">Millal oli su viimane trenn?</label>
      </td>
      <td>
        <input type="date" id="kuupäev" min="2026-01-01" max="2026-12-31">
      </td>
    </tr>
    <tr>
      Kasuta w3scholls ja proovi ise input type, vali ise 5 erineva tk
    </tr>
    <tr>
      <td>
        <input type="reset" value="Puhasta" onclick="puhasta()">
      </td>
      <td>
        <input type="button" value="Näita andmed" onclick="tervitus()">
      </td>
      <td>
        <div id="vastus4"></div>
      </td>
    </tr>
    <tr>
      <td>
        <label for="email">Sisesta enda E-mail:</label>
      </td>
      <td>
        <input id="email" type="email">
      </td>
    </tr>
    <tr>
      <td>
        <label for="password">Sisesta enda parool:</label>
      </td>
      <td>
        <input id="password" type="password">
      </td>
    </tr>
    <tr>
      <td>
        <label for="file">Saada enda poksi pasporti pilt:</label>
      </td>
      <td>
        <input id="file" type="file">
      </td>
    </tr>
    <tr>
      <td>
        <label for="tel">Sisesta enda telefoni number:</label>
      </td>
      <td>
        <input id= "tel" type="tel">
      </td>
    </tr>
    <tr>
      <td>
        <label for="time">Kui kaua sul kestab trenn?</label>
      </td>
      <td>
        <input id="time" type="time" min="00:00:00" max="23:59:59">
      </td>
    </tr>
  </table>

</form>
<br>
<a href="https://robinharm.github.io/Veebirakenduste-alused/Tehtud.html">Tagasi Kodulehele</a>
</body>
</html>
